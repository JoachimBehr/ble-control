<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 RGB Controller</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #222; color: #fff; padding: 20px; }
        button { background: #007bff; color: white; border: none; padding: 15px 30px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-bottom: 25px; font-weight: bold; width: 100%; max-width: 300px; }
        button:disabled { background: #555; cursor: not-allowed; }
        .status { margin: 15px; font-weight: bold; font-size: 18px; color: #ffc107; }
        .container { max-width: 400px; margin: 0 auto; padding: 10px; }
        
        .wheel-box { position: relative; width: 240px; height: 240px; margin: 20px auto; }
        #canvasWheel { border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; pointer-events: none; opacity: 0.4; }
        #canvasWheel.active { pointer-events: auto; opacity: 1; }
        
        #pointer { position: absolute; width: 16px; height: 16px; border: 2px solid #fff; border-radius: 50%; background: rgba(0,0,0,0.3); pointer-events: none; top: 112px; left: 112px; display: none; box-shadow: 0 0 4px #000; }
    </style>
</head>
<body>

    <div class="container">
        <h1>RGB LED Controller</h1>
        <button id="connectBtn">Mit ESP32 verbinden</button>
        <div class="status" id="status">Status: Bereit</div>
        
        <div class="wheel-box">
            <canvas id="canvasWheel" width="240" height="240"></canvas>
            <div id="pointer"></div>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        let ledCharacteristic = null;
        let lastSendTime = 0;

        const canvas = document.getElementById('canvasWheel');
        const ctx = canvas.getContext('2d');
        const pointer = document.getElementById('pointer');
        const radius = canvas.width / 2;

        // Zeichnet das Farbrad stufenlos auf das Canvas
        for (let y = 0; y < canvas.height; y++) {
            for (let x = 0; x < canvas.width; x++) {
                let dx = x - radius;
                let dy = y - radius;
                let d = Math.sqrt(dx*dx + dy*dy);
                
                if (d <= radius) {
                    let angle = Math.atan2(dy, dx) + Math.PI; 
                    let hue = (angle / (2 * Math.PI)) * 360;
                    let saturation = d / radius;
                    ctx.fillStyle = "hsl(" + hue + ", " + (saturation * 100) + "%, 50%)";
                    ctx.fillRect(x, y, 1, 1);
                }
            }
        }

        document.getElementById('connectBtn').addEventListener('click', function() {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = "Suche läuft...";

            navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [SERVICE_UUID]
            })
            .then(function(device) {
                statusDiv.textContent = "Verbinde...";
                return device.gatt.connect();
            })
            .then(function(server) {
                return server.getPrimaryService(SERVICE_UUID);
            })
            .then(function(service) {
                return service.getCharacteristic(CHARACTERISTIC_UUID);
            })
            .then(function(characteristic) {
                ledCharacteristic = characteristic;
                statusDiv.textContent = "Verbunden! 🟢";
                statusDiv.style.color = "#28a745";
                document.getElementById('connectBtn').disabled = true;
                
                canvas.classList.add('active');
                pointer.style.display = "block";
            })
            .catch(function(error) {
                statusDiv.textContent = "Fehler: " + error.message;
                statusDiv.style.color = "#dc3545";
            });
        });

        function handleColorSelect(e) {
            if (!ledCharacteristic) return;
            
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const x = Math.min(Math.max(0, clientX - rect.left), canvas.width);
            const y = Math.min(Math.max(0, clientY - rect.top), canvas.height);
            
            const imgData = ctx.getImageData(x, y, 1, 1).data;
            if (imgData[3] === 0) return; // Wenn transparent (außerhalb des Kreises), abbrechen

            pointer.style.left = (x - 8) + "px";
            pointer.style.top = (y - 8) + "px";

            const now = Date.now();
            if (now - lastSendTime < 50) return;
            lastSendTime = now;

            ledCharacteristic.writeValueWithoutResponse(new Uint8Array([imgData[0], imgData[1], imgData[2]]))
            .catch(function(err) { console.log(err); });
        }

        canvas.addEventListener('mousedown', function(e) {
            handleColorSelect(e);
            canvas.onmousemove = handleColorSelect;
        });
        window.addEventListener('mouseup', function() { canvas.onmousemove = null; });
        
        canvas.addEventListener('touchstart', function(e) { handleColorSelect(e); });
        canvas.addEventListener('touchmove', function(e) { e.preventDefault(); handleColorSelect(e); }, { passive: false });
    </script>
</body>
</html>
