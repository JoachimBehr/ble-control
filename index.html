<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-S3 BLE RGB Controller</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #222; color: #fff; padding: 20px; }
        button { background: #007bff; color: white; border: none; padding: 15px 30px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
        button:disabled { background: #555; }
        #colorPicker { width: 80%; height: 150px; border: none; cursor: pointer; background: none; }
        .status { margin: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>RGB LED Controller</h1>
    <button id="connectBtn">Mit ESP32 verbinden</button>
    <div class="status" id="status">Status: Nicht verbunden</div>

    <div>
        <input type="color" id="colorPicker" value="#000000" disabled>
    </div>

    <script>
        // Diese UUIDs MÜSSEN mit denen im ESP32-Code übereinstimmen!
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        let bleDevice = null;
        let ledCharacteristic = null;

        const connectBtn = document.getElementById('connectBtn');
        const colorPicker = document.getElementById('colorPicker');
        const statusDiv = document.getElementById('status');

        connectBtn.addEventListener('click', async () => {
            statusDiv.textContent = "Suche nach Geräten...";
            try {
                bleDevice = await navigator.bluetooth.requestDevice({
                    // Erlaubt das Finden des ESP32, egal welchen Namen du im SoftAP vergeben hast
                    filters: [{ services: [SERVICE_UUID] }] 
                });
                
        statusDiv.textContent = "Verbinde mit Server...";
            try {
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ESP32-S3-RGB' }],
                    optionalServices: [SERVICE_UUID]
                });

                statusDiv.textContent = "Verbinde mit Server...";
                const server = await bleDevice.gatt.connect();

                statusDiv.textContent = "Suche Service...";
                const service = await server.getPrimaryService(SERVICE_UUID);

                statusDiv.textContent = "Suche Charakteristik...";
                ledCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                statusDiv.textContent = "Verbunden!";
                colorPicker.disabled = false;
                connectBtn.disabled = true;

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

            } catch (error) {
                console.error(error);
                statusDiv.textContent = "Fehler: " + error.message;
            }
        });

        colorPicker.addEventListener('input', sendColor);
        colorPicker.addEventListener('change', sendColor);

        async function sendColor() {
            if (!ledCharacteristic) return;

            // Hex-Farbe (#ffffff) in RGB-Werte zerlegen
            const hex = colorPicker.value;
            const r = parseInt(hex.substring(1, 3), 16);
            const g = parseInt(hex.substring(3, 5), 16);
            const b = parseInt(hex.substring(5, 7), 16);

            // Als 3-Byte Array senden
            const data = new Uint8Array([r, g, b]);
            try {
                await ledCharacteristic.writeValue(data);
            } catch (error) {
                console.error("Sende-Fehler:", error);
            }
        }

        function onDisconnected() {
            statusDiv.textContent = "Verbindung verloren.";
            colorPicker.disabled = true;
            connectBtn.disabled = false;
        }
    </script>
</body>
</html>
